[package]
name = "cinqic-notes"
version = "0.1.0"
description = "A local-first, user-owned notes application."
authors = ["Cinqic"]
edition = "2024"
license = "MIT"
rust-version = "1.90"

[lib]
name = "cinqic_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
notify = "8.2.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.8.1", features = ["test"] }
tauri-plugin-dialog = "2.3.2"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v4"] }
