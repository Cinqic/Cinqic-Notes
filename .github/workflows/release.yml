name: Cinqic Notes development release

on:
  push:
    tags:
      - 'v0.1.*'

permissions:
  contents: read

jobs:
  # The release candidate itself must pass the canonical gate. A green run on
  # main at some earlier commit is not evidence about this tag.
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  build:
    name: Build verified desktop artifacts (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit the tag points at, not a moving branch.
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Install Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Confirm the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} release-artifacts/ \;
          expected='${{ matrix.os == 'windows-latest' && 1 || 2 }}'
          found="$(find release-artifacts -maxdepth 1 -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) | wc -l)"
          if [ "$found" -ne "$expected" ]; then
            echo "Expected $expected package(s) on ${{ matrix.os }} but found $found" >&2
            find release-artifacts -maxdepth 1 -type f -print >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cinqic-notes-${{ matrix.os }}
          path: release-artifacts
          if-no-files-found: error

  publish:
    name: Publish checksummed development release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cinqic-notes-*
          path: release-artifacts
          merge-multiple: true
      - name: Checksum every artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          mapfile -t packages < <(find . -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) \
            -printf '%P\n' | sort)
          # One MSI plus a DEB and an AppImage.
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected 3 packages from the build matrix, found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${packages[@]}"
          # Sorted input and relative names keep this reproducible.
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cinqic Notes ${{ github.ref_name }}
          # 0.1.x is a development line; releases stay prerelease.
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.msi
            release-artifacts/*.deb
            release-artifacts/*.AppImage
            release-artifacts/SHA256SUMS.txt
